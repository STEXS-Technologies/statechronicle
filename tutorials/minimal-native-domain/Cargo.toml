[package]
name = "statechronicle-native-tutorial"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace]
resolver = "3"

[dependencies]
statechronicle = { path = "../../crates/statechronicle" }
serde = { version = "1.0", features = ["derive"] }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
ed25519-dalek = "2"
tokio = { version = "1.48.0", features = ["macros", "rt"] }
