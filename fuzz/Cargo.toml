[dependencies.statechronicle-profiles]
path = "../crates/statechronicle-profiles"

[dependencies.statechronicle-commit]
path = "../crates/statechronicle-commit"

[dependencies.statechronicle-executor]
path = "../crates/statechronicle-executor"

