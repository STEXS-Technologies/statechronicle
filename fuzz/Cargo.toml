[package]
name = "statechronicle-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bcs = { workspace = true }
ed25519-dalek = { workspace = true }
chrono = { workspace = true }

[dependencies.statechronicle-core]
path = "../crates/statechronicle-core"

[dependencies.statechronicle-domain]
path = "../crates/statechronicle-domain"

[dependencies.statechronicle-accumulator]
path = "../crates/statechronicle-accumulator"

[dependencies.statechronicle-proof]
