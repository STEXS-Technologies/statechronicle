[package]
name = "statechronicle-conformance"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace]
resolver = "3"

[dependencies]
statechronicle = { path = "../../crates/statechronicle" }
async-trait = "0.1"
serde = "1.0"
tokio = { version = "1.48.0", features = ["rt", "macros", "sync", "time"] }

[dev-dependencies]
chrono = "0.4"
ed25519-dalek = "2"
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"
