name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish crates and GitHub release assets
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reliability-gate:
    uses: ./.github/workflows/reliability-soak.yml
    with:
      duration_seconds: "600"

  release:
    needs: reliability-gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Setup Rust CI toolchain and tools
        uses: ./.github/actions/rust-ci-setup

      - name: Verify tagged commit is on main
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "FETCH_HEAD"; then
            echo "Tag ${GITHUB_REF_NAME} points to commit ${GITHUB_SHA} which is not on origin/main"
            exit 1
          fi

      - name: Validate publish ref
        if: github.event_name == 'workflow_dispatch' && inputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Manual publish must be run from a release tag, not ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Validate release version
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(cargo pkgid -p statechronicle | sed -E 's/.*#([^#]+)$/\1/')"
          if [[ "${tag_version}" != "${package_version}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match Cargo package version ${package_version}" >&2
            exit 1
          fi

      - name: Run complete release gate
        run: scripts/run_release_checks.sh

      - name: Generate and enforce coverage ratchet
        run: |
          scripts/run_coverage_json.sh
          scripts/check_coverage_ratchet.sh

      - name: Run adapter contention/recovery gate
        env:
          STATECHRONICLE_LOAD_ITERATIONS: "3"
        run: scripts/run_load_drill.sh

      - name: Build optimized workspace
        run: cargo build --workspace --release --all-features --locked

      - name: Package publishable crates
        run: cargo package --workspace --exclude statechronicle-fuzz --locked

      - name: Derive publish order from cargo metadata
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')
        shell: bash
        run: |
          set -euo pipefail
          echo "CRATE_PACKAGES=$(python3 scripts/publish-order.py --emit | tr '\n' ' ')" >> "${GITHUB_ENV}"

      - name: Prepare GitHub release notes
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v version="${version}" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: statechronicle-release-${{ github.sha }}
          path: |
            target/coverage.json
            target/package/*.crate
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          name: StateChronicle ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: false

      - name: Publish crates.io packages
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "CARGO_REGISTRY_TOKEN secret is required to publish crates" >&2
            exit 1
          fi

          crate_version() {
            cargo pkgid -p "$1" | sed -E 's/.*#//; s/.*@//'
          }

          crate_version_published() {
            local crate="$1"
            local version="$2"
            curl --fail --silent --show-error --retry 3 --retry-delay 3 \
              -H "User-Agent: statechronicle-release-ci (curl)" \
              "https://crates.io/api/v1/crates/${crate}/${version}" \
              >/dev/null 2>&1
          }

          for crate in ${CRATE_PACKAGES}; do
            version="$(crate_version "${crate}")"
            if crate_version_published "${crate}" "${version}"; then
              echo "${crate} ${version} already exists on crates.io; skipping"
              continue
            fi
            if ! cargo publish --locked -p "${crate}"; then
              if crate_version_published "${crate}" "${version}"; then
                echo "${crate} ${version} was published concurrently; continuing"
                continue
              fi
              echo "Failed to publish ${crate} ${version}" >&2
              exit 1
            fi
            echo "${crate} ${version} published successfully"
            sleep 15
          done

      - name: Verify published crates.io packages
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')
        shell: bash
        run: |
          set -euo pipefail
          crate_version() {
            cargo pkgid -p "$1" | sed -E 's/.*#//; s/.*@//'
          }
          for crate in ${CRATE_PACKAGES}; do
            version="$(crate_version "${crate}")"
            curl --fail --silent --show-error --retry 5 --retry-delay 5 \
              -H "User-Agent: statechronicle-release-ci (curl)" \
              "https://crates.io/api/v1/crates/${crate}/${version}" >/dev/null
            sleep 2
          done
