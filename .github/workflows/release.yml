name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish crates and GitHub release assets
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reliability-gate:
    uses: ./.github/workflows/reliability-soak.yml
    with:
      duration_seconds: "600"

  release:
    needs: reliability-gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout release history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Setup Rust CI toolchain and tools
        uses: ./.github/actions/rust-ci-setup
        with:
          rust-components: rustfmt,clippy,llvm-tools-preview

      - name: Verify tagged commit is on main
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" FETCH_HEAD

      - name: Validate publish ref
        if: github.event_name == 'workflow_dispatch' && inputs.publish == 'true'
        run: test "${GITHUB_REF_TYPE}" = tag

      - name: Validate release version
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(cargo pkgid -p statechronicle | sed -E 's/.*#([^#]+)$/\1/')"
          test "${tag_version}" = "${package_version}"

      - name: Run complete release gate
        run: scripts/run_release_checks.sh

      - name: Generate and enforce coverage ratchet
        run: |
          scripts/run_coverage_json.sh
          scripts/check_coverage_ratchet.sh

      - name: Run adapter contention/recovery gate
        env:
          STATECHRONICLE_LOAD_ITERATIONS: "3"
        run: scripts/run_load_drill.sh

      - name: Build optimized workspace
        run: cargo build --workspace --release --all-features --locked

      - name: Package publishable crates
        run: cargo package --workspace --exclude statechronicle-fuzz --locked

      - name: Prepare GitHub release notes
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v version="${version}" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: statechronicle-release-${{ github.sha }}
          path: |
            target/coverage.json
            target/package/*.crate
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          name: StateChronicle ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: false

      - name: Publish crates.io packages
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CARGO_REGISTRY_TOKEN:-}"
          for crate in statechronicle-core statechronicle-domain statechronicle-intent statechronicle-profiles statechronicle-ports statechronicle-accumulator statechronicle-executor statechronicle-commit statechronicle-proof statechronicle-index statechronicle statechronicle-sqlite statechronicle-postgres; do
            cargo publish --locked -p "${crate}"
            sleep 15
          done
