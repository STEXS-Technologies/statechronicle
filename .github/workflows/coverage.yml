name: Coverage

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Rust coverage toolchain
        uses: ./.github/actions/rust-ci-setup
        with:
          rust-components: rustfmt,clippy,llvm-tools-preview

      - name: Generate coverage and enforce 92% ratchet
        run: |
          scripts/run_coverage_json.sh
          scripts/check_coverage_ratchet.sh

      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f target/coverage.json ]; then
            jq -r '.data[0].totals.lines | "Protocol line coverage: \(.percent)%"' target/coverage.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: statechronicle-coverage-${{ github.sha }}
          path: target/coverage.json
          if-no-files-found: error
          retention-days: 90
