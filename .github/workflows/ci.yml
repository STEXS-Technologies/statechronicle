name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Check, Test, Lint, Fuzz, MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Rust CI toolchain and tools
        uses: ./.github/actions/rust-ci-setup
        with:
          cargo-tools: cargo-nextest,cargo-llvm-cov,cargo-fuzz,cargo-audit,cargo-deny

      - name: Run release checks, fuzz smoke, and policy gates
        run: scripts/run_release_checks.sh

      - name: Check locked workspace at MSRV
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 check --workspace --all-targets --all-features --locked
