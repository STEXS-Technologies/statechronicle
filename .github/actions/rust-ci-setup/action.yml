name: Rust CI Setup
description: Install the Rust toolchain, cache Cargo artifacts, and install CI tools.

inputs:
  rust-components:
    description: Comma-separated rustup components to install.
    required: false
    default: rustfmt,clippy
  cargo-tools:
    description: Comma-separated cargo tools to install.
    required: false
    default: cargo-make,cargo-nextest,cargo-llvm-cov,cargo-audit,cargo-deny

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.rust-components }}

    - name: Cache Cargo artifacts
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: statechronicle-shared-cache

    - name: Install Cargo tools
      uses: taiki-e/install-action@v2
      with:
        tool: ${{ inputs.cargo-tools }}
